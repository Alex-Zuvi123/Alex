name: Build RealisticCamera

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile Fabric mod
        run: gradle --no-daemon clean build --stacktrace

      - name: Verify and rename JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          unzip -t "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep -q 'realisticcamera_alex'
          unzip -p "$JAR" realisticcamera.mixins.json | grep -q 'CameraMotionMixin'
          unzip -l "$JAR" | grep 'CameraDynamics.class'
          unzip -l "$JAR" | grep 'CameraMotionMixin.class'
          mkdir -p release
          cp "$JAR" release/RealisticCamera-1.21.1-Fabric-v1.1.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealisticCamera-1.21.1-Fabric-v1.1
          path: release/RealisticCamera-1.21.1-Fabric-v1.1.jar
          if-no-files-found: error
